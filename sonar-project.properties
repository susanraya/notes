# SonarQube analysis settings, read by the platform's Sonar check. A key passed on the
# scanner's command line (-Dsonar.projectKey=...) takes precedence over the one here.
sonar.projectKey=notes
sonar.projectName=notes
sonar.sourceEncoding=UTF-8
sonar.sources=frontend/src,backend/app
sonar.tests=frontend/src,frontend/e2e,backend/tests
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test-setup.ts,frontend/src/api/schema.ts,frontend/src/api/*.json
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/e2e/**,backend/tests/**
sonar.python.version=3.12
sonar.python.xunit.reportPath=backend/reports/junit/pytest.xml
