# Alembic: the database schema, one migration per change, in alembic/versions/.
#
#   alembic upgrade head                          apply every migration
#   alembic revision --autogenerate -m "add x"    write one from the model changes
#
# The app runs `alembic upgrade head` when it starts, and the tests run it on the test
# database. The database address comes from DATABASE_URL (alembic/env.py); never write
# one here, because it holds a password.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =
