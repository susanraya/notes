line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.isort]
# The migrations folder is called `alembic`, like the package it uses: without this the
# import sorter takes the package for this project's own code.
known-third-party = ["alembic"]

[format]
quote-style = "double"
