[pytest]
# `pytest` puts the test file's own directory on sys.path, not this one, so
# without `pythonpath` a bare `pytest` from here cannot `import app`.
pythonpath = .
testpaths = tests
# Every run writes a JUnit XML report to one fixed folder, which the platform reads to
# fill the test case sheet. A test for test case TC-102 has `tc102` in its name
# (see TESTING.md at the repository root).
addopts = --junitxml=reports/junit/pytest.xml
